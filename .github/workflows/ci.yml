name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"
  QT_QPA_PLATFORM: offscreen

jobs:
  quality:
    name: Formatting, static analysis, and package build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install from pyproject.toml
        run: python -m pip install -e ".[dev]"

      - name: Check static analysis
        run: python -m ruff check pdfsilo tests scripts

      - name: Check formatting
        run: python -m ruff format --check pdfsilo tests scripts

      - name: Build wheel and source distribution
        run: python -m build

      - name: Preserve Python packages
        uses: actions/upload-artifact@v4
        with:
          name: python-packages
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  core-tests:
    name: Core tests · Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install from pyproject.toml
        run: python -m pip install -e ".[dev]"

      - name: Run Qt-free core and CLI tests
        run: >-
          python -m pytest -p no:pytest-qt tests
          --ignore=tests/test_package_self_test.py
          --ignore=tests/test_password_security.py
          --ignore=tests/test_project_metadata.py
          --ignore=tests/test_ui_contracts.py
          --ignore=tests/test_ui_design.py
          --ignore=tests/test_ui_main.py
          --ignore=tests/test_ui_operation_pages.py
          --ignore=tests/test_ui_previews.py
          --ignore=tests/test_ui_settings_about.py
          --ignore=tests/test_ui_updates.py
          --ignore=tests/test_ui_widgets.py
          --ignore=tests/test_ui_workers.py
          --ignore=tests/test_windows_packaging.py

  ui-tests:
    name: Headless UI tests · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2022
          - macos-15-intel
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1 libxkbcommon-x11-0

      - name: Install from pyproject.toml
        run: python -m pip install -e ".[dev]"

      - name: Run headless-compatible UI tests
        run: >-
          python -m pytest
          tests/test_package_self_test.py
          tests/test_password_security.py
          tests/test_project_metadata.py
          tests/test_ui_contracts.py
          tests/test_ui_design.py
          tests/test_ui_main.py
          tests/test_ui_operation_pages.py
          tests/test_ui_previews.py
          tests/test_ui_settings_about.py
          tests/test_ui_updates.py
          tests/test_ui_widgets.py
          tests/test_ui_workers.py
          tests/test_windows_packaging.py
