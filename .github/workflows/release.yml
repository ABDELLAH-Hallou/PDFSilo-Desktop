name: Windows release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: Version to build without publishing
        required: true
        default: "0.1.0"
        type: string

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"
  QT_QPA_PLATFORM: offscreen
  PDFSILO_RELEASE_TAG: >-
    ${{ github.event_name == 'workflow_dispatch' &&
        format('v{0}', inputs.version) || github.ref_name }}
  PDFSILO_UNSIGNED_RELEASE_TAG: "v0.1.0"
  PDFSILO_PUBLIC_RELEASE_REPOSITORY: "ABDELLAH-Hallou/PDFSilo"

jobs:
  verify:
    name: Verify tagged source
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Linux Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1 libxkbcommon-x11-0

      - name: Install from pyproject.toml
        run: python -m pip install -e ".[dev]"

      - name: Validate tag and checked-in versions
        run: python scripts/validate_release.py "$PDFSILO_RELEASE_TAG"

      - name: Check formatting and static analysis
        run: |
          python -m ruff check pdfsilo tests scripts
          python -m ruff format --check pdfsilo tests scripts

      - name: Run the complete test suite
        run: python -m pytest

  windows-package:
    name: Build Windows x64
    needs: verify
    runs-on: windows-2022
    environment: release
    outputs:
      version: ${{ steps.version.outputs.version }}
      signing_mode: ${{ steps.signing-policy.outputs.mode }}
    env:
      PDFSILO_SIGNING_CERTIFICATE_BASE64: >-
        ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
      PDFSILO_SIGNING_CERTIFICATE_PASSWORD: >-
        ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Validate tag and expose version
        id: version
        shell: pwsh
        run: |
          $version = python scripts/validate_release.py `
              "$env:PDFSILO_RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) {
              throw "Release version validation failed."
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Select the release signing policy
        id: signing-policy
        shell: pwsh
        run: |
          $hasCertificate = -not [string]::IsNullOrWhiteSpace(
              $env:PDFSILO_SIGNING_CERTIFICATE_BASE64
          )
          $hasPassword = -not [string]::IsNullOrWhiteSpace(
              $env:PDFSILO_SIGNING_CERTIFICATE_PASSWORD
          )
          if ($hasCertificate -xor $hasPassword) {
              throw (
                  "Configure both Windows signing secrets or neither of " +
                  "them. Partial signing configuration is not permitted."
              )
          }
          if ($hasCertificate) {
              "mode=authenticode" >> $env:GITHUB_OUTPUT
          } elseif (
              $env:PDFSILO_RELEASE_TAG -eq $env:PDFSILO_UNSIGNED_RELEASE_TAG
          ) {
              Write-Warning (
                  "Publishing the documented unsigned v0.1.0 bootstrap " +
                  "release. Windows will identify its publisher as unknown."
              )
              "mode=unsigned-exception" >> $env:GITHUB_OUTPUT
          } else {
              throw (
                  "Unsigned publication is permitted only for v0.1.0. " +
                  "Configure both release signing secrets for every later " +
                  "version."
              )
          }

      - name: Create deployment environment
        shell: pwsh
        run: |
          python -m venv venv
          .\venv\Scripts\python.exe -m pip install ".[deploy]"

      - name: Load the Visual C++ build environment and build
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} `
              "Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere `
              -latest `
              -products * `
              -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
              -property installationPath
          if (-not $installation) {
              throw "Visual C++ Build Tools were not found."
          }
          $developerShell = Join-Path `
              $installation `
              "Common7\Tools\Launch-VsDevShell.ps1"
          & $developerShell -Arch amd64 -HostArch amd64
          .\scripts\build_windows.ps1 `
              -PythonPath ".\venv\Scripts\python.exe"

      - name: Run the frozen application tests
        shell: pwsh
        run: .\scripts\test_windows_package.ps1 -TimeoutSeconds 120

      - name: Install Inno Setup when absent
        shell: pwsh
        run: |
          $iscc = Get-Command iscc.exe -ErrorAction SilentlyContinue
          $standardPath = Join-Path ${env:ProgramFiles(x86)} `
              "Inno Setup 6\ISCC.exe"
          if ($null -eq $iscc -and -not (Test-Path $standardPath)) {
              choco install innosetup --yes --no-progress
          }

      - name: Import the release certificate
        if: steps.signing-policy.outputs.mode == 'authenticode'
        id: certificate
        shell: pwsh
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP "pdfsilo-signing.pfx"
          try {
              $bytes = [Convert]::FromBase64String(
                  $env:PDFSILO_SIGNING_CERTIFICATE_BASE64
              )
              [IO.File]::WriteAllBytes($pfxPath, $bytes)
              $password = ConvertTo-SecureString `
                  $env:PDFSILO_SIGNING_CERTIFICATE_PASSWORD `
                  -AsPlainText `
                  -Force
              $importedCertificates = Import-PfxCertificate `
                  -FilePath $pfxPath `
                  -CertStoreLocation "Cert:\CurrentUser\My" `
                  -Password $password
              $certificate = @($importedCertificates) |
                  Where-Object { $_.HasPrivateKey } |
                  Select-Object -First 1
              if ($null -eq $certificate) {
                  throw (
                      "The imported Windows signing certificate has no " +
                      "private key."
                  )
              }
              "thumbprint=$($certificate.Thumbprint)" >> $env:GITHUB_OUTPUT
          } finally {
              Remove-Item -LiteralPath $pfxPath -Force -ErrorAction SilentlyContinue
          }

      - name: Locate signtool
        if: steps.signing-policy.outputs.mode == 'authenticode'
        id: signtool
        shell: pwsh
        run: |
          $sdkRoot = Join-Path ${env:ProgramFiles(x86)} "Windows Kits\10\bin"
          $tool = Get-ChildItem `
              -LiteralPath $sdkRoot `
              -Filter "signtool.exe" `
              -Recurse `
              -File |
              Where-Object { $_.Directory.Name -eq "x64" } |
              Sort-Object FullName -Descending |
              Select-Object -First 1
          if ($null -eq $tool) {
              throw "The Windows SDK signtool.exe was not found."
          }
          "path=$($tool.FullName)" >> $env:GITHUB_OUTPUT

      - name: Sign the standalone executable
        if: steps.signing-policy.outputs.mode == 'authenticode'
        shell: pwsh
        run: |
          .\scripts\sign_windows_artifacts.ps1 `
              -CertificateThumbprint "${{ steps.certificate.outputs.thumbprint }}" `
              -SignToolPath "${{ steps.signtool.outputs.path }}" `
              -ArtifactPath ".\dist\windows\PDFSilo.dist\PDFSilo.exe"

      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = Get-Command iscc.exe -ErrorAction SilentlyContinue
          if ($null -eq $iscc) {
              $isccPath = Join-Path ${env:ProgramFiles(x86)} `
                  "Inno Setup 6\ISCC.exe"
          } else {
              $isccPath = $iscc.Source
          }
          .\scripts\build_windows_installer.ps1 `
              -Version "${{ steps.version.outputs.version }}" `
              -IsccPath $isccPath

      - name: Sign the installer
        if: steps.signing-policy.outputs.mode == 'authenticode'
        shell: pwsh
        run: |
          $installer = (
              ".\dist\installer\PDFSilo-Setup-" +
              "${{ steps.version.outputs.version }}-x64.exe"
          )
          .\scripts\sign_windows_artifacts.ps1 `
              -CertificateThumbprint "${{ steps.certificate.outputs.thumbprint }}" `
              -SignToolPath "${{ steps.signtool.outputs.path }}" `
              -ArtifactPath $installer

      - name: Prepare checksums and signing metadata
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $releaseDirectory = "dist\release"
          New-Item -ItemType Directory -Path $releaseDirectory -Force |
              Out-Null
          $standalone = "dist\windows\PDFSilo.dist"
          $standaloneExe = Join-Path $standalone "PDFSilo.exe"
          $archive = Join-Path `
              $releaseDirectory `
              "PDFSilo-$version-windows-x64.zip"
          $standaloneHash = (
              Get-FileHash -LiteralPath $standaloneExe -Algorithm SHA256
          ).Hash.ToLowerInvariant()
          "$standaloneHash  PDFSilo.exe" |
              Set-Content `
                  -LiteralPath "$standaloneExe.sha256" `
                  -Encoding ascii
          Compress-Archive -Path "$standalone\*" -DestinationPath $archive
          $installer = "dist\installer\PDFSilo-Setup-$version-x64.exe"

          $signingMode = "${{ steps.signing-policy.outputs.mode }}"
          $releaseFiles = @($standaloneExe, $installer)
          $signatureRecords = foreach ($path in $releaseFiles) {
              $signature = Get-AuthenticodeSignature -LiteralPath $path
              if ($signingMode -eq "authenticode") {
                  if ($signature.Status -ne "Valid") {
                      throw "Invalid Authenticode signature for $path."
                  }
                  if ($null -eq $signature.TimeStamperCertificate) {
                      throw "Authenticode timestamp is missing for $path."
                  }
              } elseif ($signature.Status -ne "NotSigned") {
                  throw (
                      "The v0.1.0 unsigned exception expected NotSigned for " +
                      "$path but found $($signature.Status)."
                  )
              }
              [ordered]@{
                  name = [IO.Path]::GetFileName($path)
                  status = $signature.Status.ToString()
                  signer_subject = $signature.SignerCertificate.Subject
                  signer_thumbprint = $signature.SignerCertificate.Thumbprint
                  timestamp_subject = if ($signature.TimeStamperCertificate) {
                      $signature.TimeStamperCertificate.Subject
                  } else {
                      $null
                  }
              }
          }
          $signaturePath = Join-Path `
              $releaseDirectory `
              "windows-signing.json"
          [ordered]@{
              scheme = if ($signingMode -eq "authenticode") {
                  "Authenticode"
              } else {
                  "none"
              }
              mode = $signingMode
              warning = if ($signingMode -eq "unsigned-exception") {
                  "PDFSilo v0.1.0 is unsigned; Windows shows Unknown publisher."
              } else {
                  $null
              }
              artifacts = @($signatureRecords)
          } |
              ConvertTo-Json -Depth 5 |
              Set-Content -LiteralPath $signaturePath -Encoding utf8

          foreach ($path in @($archive, $installer)) {
              $hash = (
                  Get-FileHash -LiteralPath $path -Algorithm SHA256
              ).Hash.ToLowerInvariant()
              "$hash  $([IO.Path]::GetFileName($path))" |
                  Set-Content -LiteralPath "$path.sha256" -Encoding ascii
          }

          .\venv\Scripts\python.exe scripts\create_release_manifest.py `
              --version $version `
              --tag "$env:PDFSILO_RELEASE_TAG" `
              --commit "${{ github.sha }}" `
              --signature-metadata $signaturePath `
              --output "$releaseDirectory\release-manifest.json" `
              $archive `
              $installer
          $manifest = "$releaseDirectory\release-manifest.json"
          $manifestHash = (
              Get-FileHash -LiteralPath $manifest -Algorithm SHA256
          ).Hash.ToLowerInvariant()
          "$manifestHash  release-manifest.json" |
              Set-Content `
                  -LiteralPath "$manifest.sha256" `
                  -Encoding ascii
          Copy-Item `
              -LiteralPath $installer, "$installer.sha256" `
              -Destination $releaseDirectory

      - name: Preserve verified build outputs
        uses: actions/upload-artifact@v4
        with:
          name: PDFSilo-${{ steps.version.outputs.version }}-windows-x64
          path: |
            dist/windows/PDFSilo.dist/**
            dist/release/**
          if-no-files-found: error
          retention-days: 30

  clean-install:
    name: Install, test, and uninstall on a fresh Windows runner
    needs: windows-package
    runs-on: windows-2022
    steps:
      - name: Check out validation scripts
        uses: actions/checkout@v6

      - name: Download the release candidate
        uses: actions/download-artifact@v4
        with:
          name: PDFSilo-${{ needs.windows-package.outputs.version }}-windows-x64
          path: candidate

      - name: Verify, install, exercise, and uninstall the candidate
        shell: pwsh
        run: |
          function Assert-Sha256 {
              param([Parameter(Mandatory)][string]$Path)
              $checksumPath = "$Path.sha256"
              if (-not (Test-Path -LiteralPath $checksumPath -PathType Leaf)) {
                  throw "Checksum sidecar was not found: $checksumPath"
              }
              $expected = (
                  (Get-Content -LiteralPath $checksumPath -Raw).Trim() `
                      -split '\s+'
              )[0].ToLowerInvariant()
              $actual = (
                  Get-FileHash -LiteralPath $Path -Algorithm SHA256
              ).Hash.ToLowerInvariant()
              if ($actual -ne $expected) {
                  throw "SHA-256 verification failed for $Path."
              }
          }

          $version = "${{ needs.windows-package.outputs.version }}"
          $installer = (
              "candidate\release\PDFSilo-Setup-$version-x64.exe"
          )
          $standaloneExe = "candidate\windows\PDFSilo.dist\PDFSilo.exe"
          $signingMode = "${{ needs.windows-package.outputs.signing_mode }}"
          foreach ($path in @($installer, $standaloneExe)) {
              if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
                  throw "Candidate file was not found: $path"
              }
              Assert-Sha256 -Path $path
              $signature = Get-AuthenticodeSignature -LiteralPath $path
              if ($signingMode -eq "authenticode") {
                  if ($signature.Status -ne "Valid") {
                      throw "Authenticode verification failed for $path."
                  }
                  if ($null -eq $signature.TimeStamperCertificate) {
                      throw "Authenticode timestamp is missing for $path."
                  }
              } elseif ($signature.Status -ne "NotSigned") {
                  throw "Expected an unsigned v0.1.0 artifact at $path."
              }
          }

          $installRoot = Join-Path $env:LOCALAPPDATA "Programs\PDFSilo"
          $installedExe = Join-Path $installRoot "PDFSilo.exe"
          $uninstaller = Join-Path $installRoot "unins000.exe"
          $installLog = Join-Path $env:RUNNER_TEMP "pdfsilo-install.log"
          try {
              $install = Start-Process `
                  -FilePath $installer `
                  -ArgumentList @(
                      "/VERYSILENT",
                      "/SUPPRESSMSGBOXES",
                      "/NORESTART",
                      "/SP-",
                      "/LOG=$installLog"
                  ) `
                  -Wait `
                  -PassThru `
                  -WindowStyle Hidden
              if ($install.ExitCode -ne 0) {
                  throw "Installer failed with exit code $($install.ExitCode)."
              }
              if (-not (Test-Path -LiteralPath $installedExe -PathType Leaf)) {
                  throw "Installed executable was not found: $installedExe"
              }
              $productVersion = (
                  Get-Item -LiteralPath $installedExe
              ).VersionInfo.ProductVersion
              if (-not $productVersion.StartsWith($version)) {
                  throw (
                      "Installed version $productVersion does not match " +
                      "$version."
                  )
              }
              $installedSignature = Get-AuthenticodeSignature `
                  -LiteralPath $installedExe
              if ($signingMode -eq "authenticode") {
                  if ($installedSignature.Status -ne "Valid") {
                      throw "The installed executable signature is invalid."
                  }
                  if ($null -eq $installedSignature.TimeStamperCertificate) {
                      throw "The installed executable timestamp is missing."
                  }
              } elseif ($installedSignature.Status -ne "NotSigned") {
                  throw "The installed v0.1.0 executable should be unsigned."
              }
              .\scripts\test_windows_package.ps1 `
                  -ExecutablePath $installedExe `
                  -TimeoutSeconds 180
          } finally {
              if (Test-Path -LiteralPath $uninstaller -PathType Leaf) {
                  $uninstall = Start-Process `
                      -FilePath $uninstaller `
                      -ArgumentList @(
                          "/VERYSILENT",
                          "/SUPPRESSMSGBOXES",
                          "/NORESTART"
                      ) `
                      -Wait `
                      -PassThru `
                      -WindowStyle Hidden
                  if ($uninstall.ExitCode -ne 0) {
                      throw (
                          "Uninstaller failed with exit code " +
                          "$($uninstall.ExitCode)."
                      )
                  }
              }
          }
          if (Test-Path -LiteralPath $installedExe -PathType Leaf) {
              throw "PDFSilo.exe remained after uninstallation."
          }

  publish:
    name: Publish to the public release channel
    if: github.event_name == 'push'
    needs:
      - windows-package
      - clean-install
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
    steps:
      - name: Download the verified release assets
        uses: actions/download-artifact@v4
        with:
          name: PDFSilo-${{ needs.windows-package.outputs.version }}-windows-x64
          path: dist

      - name: Stage, verify, and publish the public release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.PDFSILO_RELEASE_REPOSITORY_TOKEN }}
        run: |
          $tag = "$env:PDFSILO_RELEASE_TAG"
          $repository = "$env:PDFSILO_PUBLIC_RELEASE_REPOSITORY"
          $version = "${{ needs.windows-package.outputs.version }}"
          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) {
              throw (
                  "The protected PDFSILO_RELEASE_REPOSITORY_TOKEN secret " +
                  "is not configured."
              )
          }

          $existingJson = gh release view `
              $tag `
              --repo $repository `
              --json isDraft `
              2>$null
          if ($LASTEXITCODE -eq 0) {
              $existing = $existingJson | ConvertFrom-Json
              if (-not $existing.isDraft) {
                  throw (
                      "Release $tag is already published and immutable; " +
                      "refusing to replace it."
                  )
              }
          } else {
              $notes = @(
                  "PDFSilo for Windows x64."
                  ""
                  "Download the installer or portable ZIP and its matching " +
                      ".sha256 file. Verify the checksum before running it."
              )
              if (
                  "${{ needs.windows-package.outputs.signing_mode }}" -eq
                  "unsigned-exception"
              ) {
                  $notes += @(
                      ""
                      "> [!WARNING]"
                      "> PDFSilo 0.1.0 is an unsigned bootstrap release."
                      "> Windows will show **Unknown publisher**, and Microsoft"
                      "> Defender SmartScreen may require **More info -> Run"
                      "> anyway**. Download only from this release page or"
                      "> pdfsilo.com and verify the published SHA-256 checksum."
                  )
              }
              gh release create `
                  $tag `
                  --repo $repository `
                  --target main `
                  --draft `
                  --notes ($notes -join [Environment]::NewLine) `
                  --title "PDFSilo ${{ needs.windows-package.outputs.version }}"
              if ($LASTEXITCODE -ne 0) {
                  throw "Could not create the public draft release $tag."
              }
          }

          $assetFiles = @(
              Get-ChildItem -LiteralPath "dist\release" -File
          )
          $expectedNames = @(
              "PDFSilo-$version-windows-x64.zip"
              "PDFSilo-$version-windows-x64.zip.sha256"
              "PDFSilo-Setup-$version-x64.exe"
              "PDFSilo-Setup-$version-x64.exe.sha256"
              "release-manifest.json"
              "release-manifest.json.sha256"
              "windows-signing.json"
          ) | Sort-Object
          $localNames = @($assetFiles.Name | Sort-Object)
          $localDifference = @(
              Compare-Object $expectedNames $localNames
          )
          if ($localDifference.Count -ne 0) {
              throw (
                  "The candidate contains a missing or disallowed public " +
                  "release asset."
              )
          }
          $assets = @($assetFiles.FullName)
          gh release upload `
              $tag `
              @assets `
              --repo $repository `
              --clobber
          if ($LASTEXITCODE -ne 0) {
              throw "Could not upload every public release asset."
          }

          $publishedNames = @(
              gh release view `
                  $tag `
                  --repo $repository `
                  --json assets `
                  --jq '.assets[].name'
          ) | Sort-Object
          if ($LASTEXITCODE -ne 0) {
              throw "Could not verify the public draft release assets."
          }
          $difference = @(
              Compare-Object $expectedNames $publishedNames
          )
          if ($difference.Count -ne 0) {
              throw (
                  "Public draft assets do not exactly match the verified " +
                  "release candidate."
              )
          }

          gh release edit `
              $tag `
              --repo $repository `
              --draft=false
          if ($LASTEXITCODE -ne 0) {
              throw "Could not publish the verified public release $tag."
          }
