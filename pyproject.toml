[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "safepdf"
version = "0.1.0"
description = "Privacy-first, local PDF processing toolkit with CLI and desktop interfaces."
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-2-Clause"
license-files = ["LICENSE"]
authors = [
    { name = "Abdellah HALLOU" },
]
keywords = [
    "pdf",
    "pymupdf",
    "desktop",
    "privacy",
    "pyside6",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business",
]
dependencies = [
    "PyMuPDF>=1.27.2.2",
    "PySide6>=6.10,<7",
]

[project.optional-dependencies]
dev = [
    "build>=1.3,<2",
    "pytest>=9,<10",
    "pytest-qt>=4.5,<5",
    "tomli>=2.2,<3; python_version < '3.11'",
]

[project.scripts]
safepdf = "safepdf.cli:main"
safepdf-gui = "safepdf.ui.main:main"

[project.urls]
Homepage = "https://github.com/ABDELLAH-Hallou/SafePDF"
Repository = "https://github.com/ABDELLAH-Hallou/SafePDF"
Issues = "https://github.com/ABDELLAH-Hallou/SafePDF/issues"

[tool.setuptools.packages.find]
include = ["safepdf*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
"safepdf.ui.resources" = ["*.svg"]
